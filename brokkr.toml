project = "litehtml-rs"

[litehtml]
viewport_width = 800
mode = "ahem"
pixel_diff_threshold = 10.0
element_match_threshold = 80.0

[[litehtml.fixture]]
id = "text_flow_test"
path = "fixtures/text_flow_test/text_flow_test.html"
tags = ["text", "smoke"]
expected = "pass"
pixel_diff_threshold = 6.0
element_match_threshold = 90.0

[[litehtml.fixture]]
id = "table_test"
path = "fixtures/table_test/table_test.html"
tags = ["table", "smoke"]
expected = "pass"
pixel_diff_threshold = 10.0
waive_element_threshold = true

