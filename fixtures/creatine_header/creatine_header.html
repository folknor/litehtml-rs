      /* is applied to the ghost container that is limited to 600px */

      /* That produces a background colour that just covers */
      /* the size of the "modules" and not the whole template */
      /* NO SOLUTION ATM */
      /* default #ffffff */

      background-color: #ffffff;
      }

      background-color: #d6d6d6 !important;
